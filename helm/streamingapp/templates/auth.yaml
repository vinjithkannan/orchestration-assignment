apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.auth.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.auth.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.auth.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.auth.name }}
    spec:
      containers:
        - name: {{ .Values.auth.name }}
          image: "{{ .Values.imageRegistry }}/{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}"
          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.auth.containerPort }}

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configMap.name }}
                  key: NODE_ENV
                  
            - name: MONGO_URI
              value: {{ .Values.auth.mongoUri | quote }}

            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configMap.name }}
                  key: MONGO_HOST

            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configMap.name }}
                  key: MONGO_PORT

            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configMap.name }}
                  key: MONGO_DATABASE

            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: MONGO_USERNAME

            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: MONGO_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: JWT_SECRET

            - name: CLIENT_URLS
              value: {{ .Values.auth.clientUrls | quote }}

          resources:
            requests:
              cpu: {{ .Values.auth.resources.requests.cpu | quote }}
              memory: {{ .Values.auth.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.auth.resources.limits.cpu | quote }}
              memory: {{ .Values.auth.resources.limits.memory | quote }}

          readinessProbe:
            httpGet:
              path: {{ .Values.auth.probes.readiness.path }}
              port: {{ .Values.auth.containerPort }}
            initialDelaySeconds: {{ .Values.auth.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.auth.probes.readiness.periodSeconds }}

          livenessProbe:
            httpGet:
              path: {{ .Values.auth.probes.liveness.path }}
              port: {{ .Values.auth.containerPort }}
            initialDelaySeconds: {{ .Values.auth.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.auth.probes.liveness.periodSeconds }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.auth.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.auth.service.type }}
  selector:
    app: {{ .Values.auth.name }}
  ports:
    - port: {{ .Values.auth.service.port }}
      targetPort: {{ .Values.auth.service.targetPort }}
      protocol: {{ .Values.auth.service.protocol }}