apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.mongo.name }}-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - {{ .Values.mongo.persistence.accessMode }}
  storageClassName: {{ .Values.mongo.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.mongo.persistence.size }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mongo.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.mongo.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.mongo.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mongo.name }}
    spec:
      containers:
        - name: {{ .Values.mongo.name }}
          image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"
          imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.mongo.containerPort }}
              protocol: TCP

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: MONGO_USERNAME

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: MONGO_PASSWORD

            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configMap.name }}
                  key: MONGO_DATABASE

          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db

          resources:
            requests:
              cpu: {{ .Values.mongo.resources.requests.cpu | quote }}
              memory: {{ .Values.mongo.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.mongo.resources.limits.cpu | quote }}
              memory: {{ .Values.mongo.resources.limits.memory | quote }}

          readinessProbe:
            tcpSocket:
              port: {{ .Values.mongo.containerPort }}
            initialDelaySeconds: {{ .Values.mongo.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.mongo.probes.readiness.periodSeconds }}

          livenessProbe:
            tcpSocket:
              port: {{ .Values.mongo.containerPort }}
            initialDelaySeconds: {{ .Values.mongo.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.mongo.probes.liveness.periodSeconds }}

      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: {{ .Values.mongo.name }}-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongo.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.mongo.service.type }}
  selector:
    app: {{ .Values.mongo.name }}
  ports:
    - port: {{ .Values.mongo.service.port }}
      targetPort: {{ .Values.mongo.service.targetPort }}
      protocol: {{ .Values.mongo.service.protocol }}