  name: admin

  replicaCount: 1

  image:
    repository: streamingapp/admin-service
    tag: "1"
    pullPolicy: Always

  containerPort: 3003

  s3Bucket: "streamingapp-508564775932-30527"

  awsRegion: "ap-south-1"

  clientUrls: "http://localhost:3000,http://k8s-streamin-streamin-ca676dcfa1-235819436.ap-south-1.elb.amazonaws.com"

  mongoUri: "mongodb://mongodb:27017/streamingapp"

  service:
    type: ClusterIP
    port: 3003
    targetPort: 3003
    protocol: TCP

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

