namespace: streamingapp

imageRegistry: 508564775932.dkr.ecr.ap-south-1.amazonaws.com

configMap:
  name: streamingapp-config

  data:
    NODE_ENV: "production"
    APP_ENV: "production"

    MONGO_HOST: "mongodb"
    MONGO_PORT: "27017"
    MONGO_DATABASE: "streamingapp"

    AUTH_SERVICE_URL: "http://auth:3001"
    STREAMING_SERVICE_URL: "http://streaming:3002"
    ADMIN_SERVICE_URL: "http://admin:3003"
    CHAT_SERVICE_URL: "http://chat:3004"

    API_BASE_URL: "/api"

secret:
  name: streamingapp-secret

  data:
    MONGO_USERNAME: "streamingapp"
    MONGO_PASSWORD: "streamingapp123"

    JWT_SECRET: "gWzgvK1ImRGinUPscFdRUjnWCl+H/WdKk9dfjhZxau8="

    # If your application requires these:
    AUTH_SECRET: "auth-secret-change-me"
    SESSION_SECRET: "session-secret-change-me"


ingress:
  name: streamingapp-ingress

  annotations:
    ingressClass: alb
    scheme: internet-facing
    targetType: ip
    listenPorts: '[{"HTTP":80}]'
    healthcheckProtocol: HTTP
    healthcheckPort: traffic-port
    healthcheckIntervalSeconds: "15"
    successCodes: "200"

  routes:
    auth:
      path: /api/auth
      pathType: Prefix
      serviceName: auth
      servicePort: 3001

    streaming:
      path: /api/streaming
      pathType: Prefix
      serviceName: streaming
      servicePort: 3002

    admin:
      path: /api/admin
      pathType: Prefix
      serviceName: admin
      servicePort: 3003

    chat:
      path: /api/chat
      pathType: Prefix
      serviceName: chat
      servicePort: 3004
    
    socketio:
      path: /socket.io
      pathType: Prefix
      serviceName: chat
      servicePort: 3004

    frontend:
      path: /
      pathType: Prefix
      serviceName: frontend
      servicePort: 80

storageClass:
  enabled: true
  name: streamingapp-gp3
  provisioner: ebs.csi.aws.com
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  reclaimPolicy: Delete

  parameters:
    type: gp3
    fsType: ext4

mongo:
  name: mongodb
  replicaCount: 1

  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent

  containerPort: 27017

  database: streamingapp

  persistence:
    enabled: true
    storageClassName: streamingapp-gp3
    accessMode: ReadWriteOnce
    size: 10Gi

  service:
    type: ClusterIP
    port: 27017
    targetPort: 27017
    protocol: TCP

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20

auth:
  name: auth

  replicaCount: 2

  image:
    repository: streamingapp/auth-service
    tag: "1"
    pullPolicy: Always

  containerPort: 3001

  clientUrls: "http://localhost:3000,http://k8s-streamin-streamin-ca676dcfa1-235819436.ap-south-1.elb.amazonaws.com"

  mongoUri: "mongodb://mongodb:27017/streamingapp"

  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001
    protocol: TCP

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    readiness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 10

    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 20

