apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: streamingapp-eks
  region: ap-south-1

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: streamingapp-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    volumeType: gp3
    privateNetworking: false

addons:
  - name: eks-pod-identity-agent

  - name: aws-ebs-csi-driver

addonsConfig:
  autoApplyPodIdentityAssociations: true

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator
      - controllerManager
      - scheduler
    logRetentionInDays: 7