apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: streamingapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: 508564775932.dkr.ecr.ap-south-1.amazonaws.com/streamingapp/auth-service:1
          imagePullPolicy: Always

          ports:
            - containerPort: 3001

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: NODE_ENV

            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_HOST

            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_PORT

            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_DATABASE

            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: MONGO_USERNAME

            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: MONGO_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: JWT_SECRET

            - name: CLIENT_URLS
              value: "http://k8s-streamin-streamin-ca676dcfa1-1872173439.ap-south-1.elb.amazonaws.com"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: streamingapp
spec:
  type: ClusterIP
  selector:
    app: auth
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP