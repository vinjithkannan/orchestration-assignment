# Source: streamingapp/templates/admin.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: streamingapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: "508564775932.dkr.ecr.ap-south-1.amazonaws.com/streamingapp/admin-service:1"
          imagePullPolicy: Always

          ports:
            - containerPort: 3003

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: NODE_ENV

            - name: MONGO_URI
              value: "mongodb://mongodb:27017/streamingapp"

            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_HOST

            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_PORT

            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_DATABASE

            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: MONGO_USERNAME

            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: MONGO_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"


